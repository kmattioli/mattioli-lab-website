# SITE SETUP — https://docs.hugoblox.com/
# Only the marked fields were changed from the template defaults.

# Appearance
appearance:
  theme_day: mattioli     # CHANGED — custom warm paper + blue/gold theme (data/themes/mattioli.toml)
  theme_night:            # left empty: the paper aesthetic is light-only, like the source site
  font: mattioli          # CHANGED — IBM Plex superfamily (data/fonts/mattioli.toml)
  font_size: L

# SEO
marketing:
  seo:
    site_type: Organization
    local_business_type: ''
    org_name: 'Mattioli Lab'                                  # CHANGED
    description: 'The Mattioli Lab decodes alternative RNA isoforms in cancer using high-throughput, isoform-specific functional genomics.'  # CHANGED
    twitter: ''
  analytics:
    google_analytics: ''
    baidu_tongji: ''
    google_tag_manager: ''
    microsoft_clarity: ''
  verification:
    google: ''
    baidu: ''

# Site header
header:
  navbar:
    enable: true
    align: r
    show_logo: true
    show_language: false
    show_day_night: false   # CHANGED — single light "paper" theme (no dark mode), matching the source site
    show_search: true
    highlight_active_link: false

# Site footer
footer:
  copyright:
    notice: '© {year} Mattioli Lab'                            # CHANGED
    license:
      enable: false                                           # CHANGED (turn on if you want a CC license shown)
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

# Localization
locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'
  address_format: en-us

# Site features
features:
  syntax_highlighter:
    enable: false
    extra_languages:
      - r
      - latex
  math:
    enable: false
  privacy_pack:
    enable: false
  repository:
    url: 'https://github.com/<username>/<repository>'         # CHANGE to your repo (enables "edit this page")
    content_dir: content
    branch: main
  avatar:
    gravatar: false
    shape: circle
  comment:
    provider: ''
  search:
    provider: wowchemy
  map:
    provider: 'mapnik'
    api_key: ''
    zoom: 15

# Extensions
extensions:
  decap_cms:
    branch: main
    local_backend: false
  academicons:
    enable: true

# Citation style
publications:
  date_format: January 2006
  citation_style: apa
