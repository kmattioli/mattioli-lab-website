<svg viewBox="0 0 420 430" width="420" height="430" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="A static gene with three exons and splice arcs branches into two animated outcomes: in normal cells all exons are spliced into transcript A and isoform A; in cancer cells the gold cassette exon is skipped, giving transcript B and an altered isoform B that binds a different DNA motif, changing molecular function">
  <style>
    /* Self-contained — runs when loaded as an img. Lab palette:
       blue #1f56a6, gold #cf9f2e, red #c62a28, navy #16345f, muted #5b5a61.
       Only the top gene (DNA) is static; everything else animates in as it
       emerges over an 11s loop. */
    .lab { font-family:"Roboto Mono", ui-monospace, monospace; font-size:9.5px; letter-spacing:1px; fill:#5b5a61; }
    .seq { font-family:"Roboto Mono", ui-monospace, monospace; font-size:10px; letter-spacing:2px; fill:#5b5a61; }
    .cap { font-family:"Roboto Mono", ui-monospace, monospace; font-size:11px; letter-spacing:2px; fill:#16345f; }
    .hd  { font-family:"Roboto Mono", ui-monospace, monospace; font-size:15px; letter-spacing:2px; font-weight:500; }
    .hd.n { fill:#1f56a6; } .hd.c { fill:#c62a28; }
    .intron { stroke:#9aa0a8; stroke-width:2.5; stroke-linecap:round; }
    .ar { fill:none; stroke:#1f56a6; stroke-width:2.5; stroke-linecap:round; }
    .ar.skip { stroke:#c62a28; }

    .fork  { animation: fork  11s ease-in-out infinite; opacity:0; }
    .cells { animation: cells 11s ease-in-out infinite; opacity:0; }
    .pre   { animation: pre   11s ease-in-out infinite; opacity:0; }
    .sx    { animation: join  11s ease-in-out infinite; opacity:0; }
    .fade  { animation: fade  11s ease-in-out infinite; opacity:0; }
    .arc   { animation: arc   11s ease-in-out infinite; opacity:0; }
    .tlab  { animation: tlab  11s ease-in-out infinite; opacity:0; }
    .ar2   { animation: ar2   11s ease-in-out infinite; opacity:0; }
    .prot  { animation: prot  11s ease-in-out infinite; opacity:0; }
    .ilab  { animation: ilab  11s ease-in-out infinite; opacity:0; }
    .c4p   { animation: cap   11s ease-in-out infinite; opacity:0; }

    @keyframes fork  { 0%,4%{opacity:0} 9%,88%{opacity:1} 95%,100%{opacity:0} }
    @keyframes cells { 0%,9%{opacity:0} 14%,88%{opacity:1} 95%,100%{opacity:0} }
    @keyframes pre   { 0%,15%{opacity:0} 19%,88%{opacity:1} 95%,100%{opacity:0} }
    @keyframes join {
      0%,15%   { opacity:0; transform:translateX(0); }
      19%,37%  { opacity:1; transform:translateX(0); }
      50%,88%  { opacity:1; transform:translateX(var(--shift,0)); }
      95%,100% { opacity:0; transform:translateX(var(--shift,0)); }
    }
    @keyframes fade  { 0%,15%{opacity:0} 19%,37%{opacity:1} 50%,100%{opacity:0} }
    @keyframes arc {
      0%,22% { opacity:0; stroke-dashoffset:130; }
      33%    { opacity:1; stroke-dashoffset:0; }
      37%    { opacity:1; stroke-dashoffset:0; }
      50%    { opacity:0; stroke-dashoffset:0; }
      100%   { opacity:0; }
    }
    @keyframes tlab { 0%,54%{opacity:0} 58%,88%{opacity:1} 95%,100%{opacity:0} }
    @keyframes ar2  { 0%,60%{opacity:0} 64%,88%{opacity:1} 95%,100%{opacity:0} }
    @keyframes prot { 0%,66%{opacity:0} 71%,88%{opacity:1} 95%,100%{opacity:0} }
    @keyframes ilab { 0%,72%{opacity:0} 76%,88%{opacity:1} 95%,100%{opacity:0} }
    @keyframes cap  { 0%,78%{opacity:0} 82%,90%{opacity:1} 96%,100%{opacity:0} }

    @media (prefers-reduced-motion: reduce) {
      .fork,.cells,.pre,.tlab,.ar2,.prot,.ilab,.c4p { animation:none; opacity:1; }
      .sx   { animation:none; opacity:1; transform:translateX(var(--shift,0)); }
      .fade { animation:none; opacity:0; }
      .arc  { animation:none; opacity:0; }
    }
  </style>

  <!-- ============== STATIC: gene (DNA + exons + splice arcs) ============== -->
  <g stroke="#16345f" stroke-width="1.4" fill="none" opacity="0.40">
    <path d="M72 52 q11.5 -6 23 0 t23 0 t23 0 t23 0 t23 0 t23 0 t23 0 t23 0 t23 0 t23 0 t23 0 t23 0"/>
    <path d="M72 52 q11.5 6 23 0 t23 0 t23 0 t23 0 t23 0 t23 0 t23 0 t23 0 t23 0 t23 0 t23 0 t23 0"/>
  </g>
  <g fill="none" stroke="#1f56a6" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <path d="M150 44 Q170 30 190 44"/>
    <path d="M214 44 Q238 30 262 44"/>
  </g>
  <path d="M150 44 Q206 16 262 44" fill="none" stroke="#9aa0a8" stroke-width="1.6" stroke-dasharray="3 3" opacity="0.8"/>
  <rect x="120" y="44" width="30" height="16" rx="2.5" fill="#c62a28"/>
  <rect x="190" y="44" width="24" height="16" rx="2.5" fill="#cf9f2e"/>
  <rect x="262" y="44" width="38" height="16" rx="2.5" fill="#1f56a6"/>

  <!-- "alternative splicing" + fork to the two call-outs (no central stem) -->
  <g class="fork">
    <text class="lab" x="210" y="80" text-anchor="middle">alternative splicing</text>
    <g stroke="#9aa0a8" stroke-width="1.6" fill="#9aa0a8">
      <path d="M105 94 H315 M105 94 V108 M315 94 V108" fill="none"/>
      <path d="M105 112 l-3 -5 h6 z"/><path d="M315 112 l-3 -5 h6 z"/>
    </g>
  </g>

  <!-- column divider -->
  <line x1="210" y1="124" x2="210" y2="414" stroke="#e4dfd2" stroke-width="1" stroke-dasharray="3 5"/>

  <!-- headers + cells -->
  <g class="cells">
    <text class="hd n" x="105" y="130" text-anchor="middle">NORMAL</text>
    <text class="hd c" x="315" y="130" text-anchor="middle">CANCER</text>
    <!-- normal: two tidy cells -->
    <ellipse cx="96"  cy="160" rx="17" ry="16" fill="#eaf1fb" stroke="#1f56a6" stroke-width="1.5"/>
    <circle  cx="96"  cy="160" r="6" fill="#b9d0ee"/>
    <ellipse cx="119" cy="156" rx="14" ry="14" fill="#eaf1fb" stroke="#1f56a6" stroke-width="1.5"/>
    <circle  cx="119" cy="156" r="5" fill="#b9d0ee"/>
    <!-- cancer: distinct irregular cells, one nucleus each -->
    <ellipse cx="301" cy="156" rx="14" ry="13" fill="#f1ddb8" stroke="#c98a3a" stroke-width="1.3"/>
    <circle  cx="301" cy="156" r="5" fill="#b06a2a"/>
    <ellipse cx="329" cy="153" rx="13" ry="15" fill="#f1ddb8" stroke="#c98a3a" stroke-width="1.3"/>
    <circle  cx="329" cy="153" r="5" fill="#b06a2a"/>
    <ellipse cx="316" cy="173" rx="15" ry="12" fill="#f1ddb8" stroke="#c98a3a" stroke-width="1.3"/>
    <circle  cx="316" cy="173" r="5" fill="#b06a2a"/>
  </g>

  <!-- arrows cells -> transcript -->
  <g class="pre" stroke="#9aa0a8" stroke-width="1.6" fill="#9aa0a8">
    <line x1="105" y1="194" x2="105" y2="212"/><path d="M105 216 l-3 -5 h6 z"/>
    <line x1="315" y1="194" x2="315" y2="212"/><path d="M315 216 l-3 -5 h6 z"/>
  </g>

  <!-- ============== TRANSCRIPTS / SPLICING (converge to center) ============== -->
  <!-- NORMAL -->
  <g>
    <g class="fade">
      <line class="intron" x1="71"  y1="238" x2="93"  y2="238"/>
      <line class="intron" x1="117" y1="238" x2="139" y2="238"/>
    </g>
    <path class="ar arc" d="M71 230 Q82 216 93 230"  stroke-dasharray="60"/>
    <path class="ar arc" d="M117 230 Q128 216 139 230" stroke-dasharray="60"/>
    <g class="sx" style="--shift:22px"><rect x="35"  y="230" width="36" height="16" rx="2.5" fill="#c62a28"/></g>
    <g class="sx" style="--shift:0px"><rect x="93"  y="230" width="24" height="16" rx="2.5" fill="#cf9f2e"/></g>
    <g class="sx" style="--shift:-22px"><rect x="139" y="230" width="36" height="16" rx="2.5" fill="#1f56a6"/></g>
  </g>
  <!-- CANCER: gold cassette exon skipped -->
  <g>
    <g class="fade">
      <line class="intron" x1="281" y1="238" x2="303" y2="238"/>
      <line class="intron" x1="327" y1="238" x2="349" y2="238"/>
      <rect x="303" y="230" width="24" height="16" rx="2.5" fill="#cf9f2e"/>
    </g>
    <path class="ar arc skip" d="M281 230 Q315 208 349 230" stroke-dasharray="120"/>
    <g class="sx" style="--shift:34px"><rect x="245" y="230" width="36" height="16" rx="2.5" fill="#c62a28"/></g>
    <g class="sx" style="--shift:-34px"><rect x="349" y="230" width="36" height="16" rx="2.5" fill="#1f56a6"/></g>
  </g>

  <!-- transcript labels -->
  <text class="lab tlab" x="105" y="270" text-anchor="middle">transcript A</text>
  <text class="lab tlab" x="315" y="270" text-anchor="middle">transcript B</text>

  <!-- arrows transcript -> protein -->
  <g class="ar2" stroke="#9aa0a8" stroke-width="1.6" fill="#9aa0a8">
    <line x1="105" y1="280" x2="105" y2="298"/><path d="M105 302 l-3 -5 h6 z"/>
    <line x1="315" y1="280" x2="315" y2="298"/><path d="M315 302 l-3 -5 h6 z"/>
  </g>

  <!-- ============== PROTEINS (isoforms) ON DNA ============== -->
  <g class="prot">
    <ellipse cx="93"  cy="328" rx="18" ry="16" fill="#c62a28" stroke="#16345f" stroke-width="1" stroke-opacity="0.18"/>
    <ellipse cx="114" cy="324" rx="16" ry="15" fill="#1f56a6" stroke="#16345f" stroke-width="1" stroke-opacity="0.18"/>
    <ellipse cx="104" cy="340" rx="11" ry="10" fill="#cf9f2e" stroke="#16345f" stroke-width="1" stroke-opacity="0.18"/>
    <g stroke="#16345f" stroke-width="1.6" fill="none" opacity="0.85">
      <path d="M78 356 q6.75 -8 13.5 0 t13.5 0 t13.5 0 t13.5 0"/>
      <path d="M78 356 q6.75 8 13.5 0 t13.5 0 t13.5 0 t13.5 0"/>
    </g>
    <text class="seq" x="105" y="374" text-anchor="middle">TGA<tspan fill="#1f56a6">C</tspan>GT</text>
  </g>
  <g class="prot">
    <ellipse cx="303" cy="328" rx="18" ry="16" fill="#c62a28" stroke="#16345f" stroke-width="1" stroke-opacity="0.18"/>
    <ellipse cx="324" cy="324" rx="16" ry="15" fill="#1f56a6" stroke="#16345f" stroke-width="1" stroke-opacity="0.18"/>
    <ellipse cx="314" cy="340" rx="11" ry="10" fill="none" stroke="#c98a3a" stroke-width="1.4" stroke-dasharray="3 3" opacity="0.7"/>
    <g stroke="#16345f" stroke-width="1.6" fill="none" opacity="0.85">
      <path d="M288 356 q6.75 -8 13.5 0 t13.5 0 t13.5 0 t13.5 0"/>
      <path d="M288 356 q6.75 8 13.5 0 t13.5 0 t13.5 0 t13.5 0"/>
    </g>
    <text class="seq" x="315" y="374" text-anchor="middle">TG<tspan fill="#c62a28">C</tspan>CGT</text>
  </g>

  <!-- isoform labels -->
  <text class="lab ilab" x="105" y="392" text-anchor="middle">isoform A</text>
  <text class="lab ilab" x="315" y="392" text-anchor="middle">isoform B</text>

  <!-- bottom caption -->
  <text class="cap c4p" x="210" y="420" text-anchor="middle">&#916; molecular functions</text>
</svg>
