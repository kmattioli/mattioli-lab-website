<svg class="splice-hero" viewBox="0 0 280 120" width="280" height="120"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Animation of RNA splicing: introns are excised and exons join into a mature transcript">
  <style>
    /* Self-contained styles so the animation runs even when the SVG is loaded
       as an img (no access to the site stylesheet). Colors are the lab
       palette: brand blue #1f56a6, gold #cf9f2e, red #c62a28, muted #5b5a61. */
    .s-intron line {
      stroke: #1f56a6; stroke-width: 3; stroke-linecap: round;
    }
    .s-intron { animation: sIntron 8s ease-in-out infinite; }
    .s-arc {
      fill: none; stroke: #1f56a6; stroke-width: 3; stroke-linecap: round;
      stroke-dasharray: 90; stroke-dashoffset: 90; opacity: 0;
      animation: sArc 8s ease-in-out infinite;
    }
    .s-arc.a2 { animation-delay: 0.08s; }
    .s-arc.a3 { animation-delay: 0.16s; }
    .sx { animation: sJoin 8s ease-in-out infinite; }
    .s-lab {
      fill: #5b5a61; font-family: "Roboto Mono", ui-monospace, monospace;
      font-size: 12px; letter-spacing: 3px;
    }

    @keyframes sJoin {
      0%, 16%, 30% { transform: translateX(0); }
      48%, 72%     { transform: translateX(var(--shift, 0)); }
      90%, 100%    { transform: translateX(0); }
    }
    @keyframes sIntron {
      0%, 30%   { opacity: 1; }
      44%       { opacity: 0; }
      74%       { opacity: 0; }
      90%, 100% { opacity: 1; }
    }
    @keyframes sArc {
      0%, 16% { opacity: 0; stroke-dashoffset: 90; }
      30%     { opacity: 1; stroke-dashoffset: 0; }
      40%     { opacity: 1; stroke-dashoffset: 0; }
      48%     { opacity: 0; stroke-dashoffset: 0; }
      100%    { opacity: 0; stroke-dashoffset: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .sx       { animation: none; transform: translateX(0); }
      .s-intron { animation: none; opacity: 1; }
      .s-arc    { animation: none; opacity: 0; }
    }
  </style>

  <g transform="translate(24,0)">
    <!-- introns (the segments removed) -->
    <g class="s-intron">
      <line x1="42"  y1="70" x2="70"  y2="70" />
      <line x1="100" y1="70" x2="130" y2="70" />
      <line x1="156" y1="70" x2="186" y2="70" />
    </g>

    <!-- lariat/splice arcs -->
    <path class="s-arc a1" d="M42 59 Q56 30 70 59" />
    <path class="s-arc a2" d="M100 59 Q115 30 130 59" />
    <path class="s-arc a3" d="M156 59 Q171 30 186 59" />

    <!-- exons: blue / gold / red / blue — slide together as introns excise -->
    <g class="sx" style="--shift:44px"><rect  x="0"   y="59" width="42" height="22" rx="3" fill="#1f56a6" /></g>
    <g class="sx" style="--shift:16px"><rect  x="70"  y="59" width="30" height="22" rx="3" fill="#cf9f2e" /></g>
    <g class="sx" style="--shift:-14px"><rect x="130" y="59" width="26" height="22" rx="3" fill="#c62a28" /></g>
    <g class="sx" style="--shift:-44px"><rect x="186" y="59" width="46" height="22" rx="3" fill="#1f56a6" /></g>

    <text class="s-lab" x="116" y="104" text-anchor="middle">SPLICING</text>
  </g>
</svg>
