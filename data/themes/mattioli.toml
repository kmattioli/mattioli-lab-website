# Mattioli Lab — Miró color scheme
# Flat primary inks (red lead / gold accent / blue support) drawn with a
# near-black ink outline on a warm painterly cream ground. Most of the look is
# carried by assets/scss/template.scss; this sets the HugoBlox primary + menu +
# alternating section bands.

name = "Mattioli Lab"

[light]
  # Primary action = the blue "lead" exon (buttons, accents), per the prototype.
  primary = "#2A6FB0"

  # Navbar (further styled as a glass bar in template.scss)
  menu_primary = "#F6F4EF"   # warm paper
  menu_text = "#3A3F4A"      # ink soft
  menu_text_active = "#1B1A17" # ink
  menu_title = "#1B1A17"

  # Alternating homepage section bands
  home_section_odd = "#F1EAD7"   # cream ground
  home_section_even = "#E9E0C8"  # cream deep (recessed well)
