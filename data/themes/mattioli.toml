# Mattioli Lab color theme
# A warm "paper" light theme with a blue / red / gold triad pulled from the
# lab's figures. This file controls the PRIMARY accent color, the navbar colors,
# and the alternating background bands on the homepage. Everything else (cards,
# buttons, footer, type details) lives in `assets/scss/template.scss`.
#
# To re-skin the whole site, change `primary` here and the palette block at the
# top of template.scss.

name = "Mattioli"

[light]
  # Primary accent — used for links, buttons, and active states
  primary = "#1f56a6"        # brand blue

  # Navbar
  menu_primary = "#faf9f5"   # warm paper background
  menu_text = "#5b5a61"      # muted secondary text
  menu_text_active = "#1f56a6"
  menu_title = "#1a1a20"     # near-black ink

  # Homepage alternating section bands
  home_section_odd = "#faf9f5"   # paper
  home_section_even = "#f0ede4"  # slightly deeper panel
