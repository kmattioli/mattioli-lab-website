# Mattioli Lab font set — Roboto (matches Kaia's LaTeX resume: roboto, light)
# Headers are rendered as spaced ALL-CAPS in template.scss to mirror the
# resume's \textsc / \scshape header style. Roboto Mono for small labels.

name = "Mattioli"

# Google Fonts CSS2 query (appended to https://fonts.googleapis.com/css2?...)
# Includes weight 300 (light) to match the resume's light Roboto.
google_fonts = "family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Roboto+Mono:wght@400;500"

# Font families
heading_font = "Roboto"
body_font = "Roboto"
nav_font = "Roboto"
mono_font = "Roboto Mono"
