# Mattioli Lab font set
#   Archivo        — display + UI (wordmark/headlines use weight 800)
#   IBM Plex Mono  — uppercase, wide-tracked labels/kickers/nav/metadata
# Both on Google Fonts.

name = "Mattioli"

# Google Fonts CSS2 query (appended to https://fonts.googleapis.com/css2?...)
google_fonts = "family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700"

# Font families
heading_font = "Archivo"
body_font = "Archivo"
nav_font = "Archivo"
mono_font = "IBM Plex Mono"
