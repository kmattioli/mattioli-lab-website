# Mattioli Lab font set
# The IBM Plex superfamily — a clean, technical, "research" look.
#   Serif  -> display headings
#   Sans   -> body text + navigation
#   Mono   -> small uppercase labels (the "scientific" signature)
# Loaded from Google Fonts.

name = "Mattioli"

# Google Fonts CSS2 query (appended to https://fonts.googleapis.com/css2?...)
google_fonts = "family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500"

# Font families
heading_font = "IBM Plex Serif"
body_font = "IBM Plex Sans"
nav_font = "IBM Plex Sans"
mono_font = "IBM Plex Mono"
